teleop_safety_gateway:
  ros__parameters:
    allowed_sources:
      - pico
      - replay
    state_timeout: 0.25
    command_timeout: 0.25
    max_joint_speed: 0.5
    max_initial_delta: 0.05
    nominal_dt: 0.01
    # Per-joint |command - measured| cap in rad; [0.0] disables it (current
    # behavior). Bounds the static contact torque at k_gains * cap. The
    # candidate for the contact trial is
    #   [0.06, 0.06, 0.06, 0.06, 0.12, 0.2, 0.3]
    # which caps every joint's contact torque at <= 36 Nm (k = 600/600/600/
    # 600/250/150/50), below the 40 Nm contact threshold, while sitting above
    # the free-space command-vs-measured maxima measured on the 2026-07-26
    # tracker session (0.045/0.040/0.035/0.037/0.040/0.090/0.111 rad).
    # Enable only after the free-space check in docs/CONTACT_IK_VALIDATION.md.
    max_command_deviation: [0.0]
