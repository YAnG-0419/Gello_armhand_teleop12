x-runtime: &runtime
  image: franka-upper-body-teleop:latest
  network_mode: host
  ipc: host
  volumes:
    - ..:/workspace/franka_upper_body_teleop
    - ${TELEOP_DATA_ROOT:?Missing TELEOP_DATA_ROOT in docker/.env}:/data
  environment:
    - ROS_LOCALHOST_ONLY=0
    - ROS_DOMAIN_ID=${TELEOP_ROS_DOMAIN_ID:?Missing TELEOP_ROS_DOMAIN_ID in docker/.env}
  working_dir: /workspace/franka_upper_body_teleop

services:
  franka-control:
    <<: *runtime
    privileged: true
    cpuset: ${FRANKA_CPUSET:?Missing FRANKA_CPUSET in docker/.env}
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: -1
    volumes:
      - ..:/workspace/franka_upper_body_teleop
      - /dev:/dev
    command:
      - ros2
      - launch
      - franka_fr3_arm_controllers
      - robot_control.launch.py
      - robot_config:=${FRANKA_ROBOT_CONFIG:?Missing FRANKA_ROBOT_CONFIG in docker/.env}

  fake-franka-control:
    <<: *runtime
    # Profiled so that a plain `docker compose up` starts the real workcell and
    # never a second, fake command source next to it. Naming the service
    # explicitly still works: compose activates a service's profiles when it is
    # targeted by name.
    profiles: [fake]
    privileged: true
    cpuset: ${FRANKA_CPUSET:?Missing FRANKA_CPUSET in docker/.env}
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: -1
    volumes:
      - ..:/workspace/franka_upper_body_teleop
      - /dev:/dev
    command:
      - ros2
      - launch
      - franka_fr3_arm_controllers
      - robot_control.launch.py
      - robot_config:=/workspace/franka_upper_body_teleop/config/fake_workcell.yaml

  hand-control:
    <<: *runtime
    # Privileged for SocketCAN and the O30i USB-CANFD adapter: with the host
    # network namespace and privileged devices the container reaches can0 and
    # the vendor USB adapter directly, verified on this machine. This service's
    # defaults match the physical hands: left G20 on can0, right O30i through
    # libcanbus USB, driven by the right-only-manus source with the left held
    # at its default pose. The bridge listens on UDP 5570, reachable from the
    # host because the network is shared.
    privileged: true
    command:
      - ros2
      - launch
      - linker_hand_bridge
      - hands.launch.py
      - sides:=both
      - left_model:=g20
      - right_model:=o30i
      # The 0/255 default tick mapping over each URDF joint range is the
      # validated O30i runtime mapping; calibration_verified acknowledges it.
      - o30_calibration_verified:=true
      # abduction_invert stays at its default (false). The unified MANUS mode
      # feeds the same L20 retargeter as the validated PICO path (offline check
      # 2026-07-27: identical skeleton chirality in both sessions' logs), so the
      # bridge's derived per-side polarity is already correct. The flag exists
      # for senders with their own, unverified abduction convention.
      # G20 slews at the full 1500 units/s; the O30i profile caps its own side
      # at 12 rad/s regardless of this value.
      - max_command_rate:=1500.0
      # Speed/torque apply to the G20 only; the O30i profile has no startup
      # settings.
      - initial_speed:=255
      - initial_torque:=200
      - initial_thumb_torque:=250

  teleop-control:
    <<: *runtime
    command:
      - ros2
      - launch
      - teleop_core
      - control.launch.py
      - config:=/workspace/franka_upper_body_teleop/config/teleop_control.yaml

  pico-bridge:
    <<: *runtime
    command:
      - ros2
      - launch
      - pico_teleop_bridge
      - pico.launch.py
      - config:=/workspace/franka_upper_body_teleop/config/pico.yaml

  orbbec:
    <<: *runtime
    command:
      - ros2
      - launch
      - orbbec_camera
      - gemini435_le.launch.py
      - enumerate_net_device:=false
      - net_device_ip:=192.168.1.10
      - net_device_port:=8090
      - connection_delay:=1
      - enable_point_cloud:=false
      - enable_colored_point_cloud:=false

  tools:
    <<: *runtime
    profiles: [tools]
    stdin_open: true
    tty: true
    command: bash
