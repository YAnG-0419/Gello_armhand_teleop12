udp:
  command_host: 127.0.0.1
  command_port: 5560
  state_host: 127.0.0.1
  state_port: 5561
  state_timeout: 0.25

host:
  # Map operator displacement one-to-one onto the end effector.
  translation_scale: 1.0
  rotation_scale: 1.0
  control_rate: 100.0
  max_joint_speed: 0.5
  robot_state_wait_timeout: 10.0

input:
  controllers:
    grip_threshold: 0.9
    ready_timeout: 30.0
    stale_timeout: 0.25
  motion_trackers:
    serials:
      left: PC2310MLL6020917G
      right: PC2310MLL5290914G
    ready_timeout: 30.0
    stale_timeout: 0.25
    frozen_timeout: 1.0
    max_position_jump: 0.20
    max_rotation_jump: 1.0
    max_linear_speed: 3.0
    max_angular_speed: 12.0
    activation:
      type: keyboard
      device: /dev/tty
    tracker_to_control:
      left:
        translation_xyz: [0.0, 0.0, 0.0]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
      right:
        translation_xyz: [0.0, 0.0, 0.0]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  hand_roots:
    ready_timeout: 30.0
    stale_timeout: 0.25
    frozen_timeout: 1.0
    # Per-changed-sample deltas, not speeds: the skeleton refreshes at ~52 Hz,
    # so 0.20 m per step is far above any real hand motion but well below the
    # 0.906 m whole-skeleton teleport measured in hand_coexistence.jsonl.
    max_position_jump: 0.20
    max_rotation_jump: 1.5
    # EMA time constant in seconds. Measured on hand_coexistence.jsonl the raw
    # wrist carries 18-37 mm rms noise; 0.1 s keeps median smoothing lag under
    # ~7 mm while cutting most of it. Raise for smoother, laggier following.
    smoothing_time_constant: 0.10
    activation:
      type: keyboard
      device: /dev/tty
