udp:
  command_host: 127.0.0.1
  command_port: 5560
  state_host: 127.0.0.1
  state_port: 5561
  state_timeout: 0.25

host:
  # 1.0 maps operator displacement one-to-one onto the end effector. The
  # previous 0.5 favoured precision but halved reach: the operator ran out of
  # arm before the robot ran out of workspace, while IK itself converges to
  # 0.0 mm on reachable targets.
  translation_scale: 1.0
  rotation_scale: 1.0
  control_rate: 100.0
  max_joint_speed: 0.5
  robot_state_wait_timeout: 10.0

input:
  controllers:
    grip_threshold: 0.9
    ready_timeout: 30.0
    stale_timeout: 0.25
  motion_trackers:
    serials:
      left: PC2310MLL6020917G
      right: PC2310MLL5290914G
    ready_timeout: 30.0
    stale_timeout: 0.25
    frozen_timeout: 1.0
    max_position_jump: 0.20
    max_rotation_jump: 1.0
    max_linear_speed: 3.0
    max_angular_speed: 12.0
    activation:
      type: keyboard
      device: /dev/tty
    tracker_to_control:
      left:
        translation_xyz: [0.0, 0.0, 0.0]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
      right:
        translation_xyz: [0.0, 0.0, 0.0]
        quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
