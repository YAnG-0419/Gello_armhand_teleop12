[project]
name = "teleop-operator-gui"
version = "0.1.0"
description = "PySide6 operator frontend for the dual-FR3 teleop control server"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
teleop-operator-gui = "teleop_operator_gui.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
